name: publish

# Publishes the package to pub.dev when release.yml pushes a version tag. Authentication is a
# short-lived OpenID Connect token signed by GitHub and exchanged with pub.dev, so no pub.dev
# credential is stored in this repository.
#
# Operator prerequisite, outside this file: on the pub.dev admin tab for laya_flutter,
# enable publishing from GitHub Actions with repository ortal83cohen/laya_flutter and tag
# pattern v{{version}}. The pattern must match the tag filter below or no run can publish.

on:
  push:
    tags:
      - "v[0-9]+.[0-9]+.[0-9]+"

jobs:
  publish:
    name: Publish to pub.dev
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      contents: read
    steps:
      - uses: actions/checkout@v4

      # Resolve public dependencies before setup-dart provisions the temporary pub.dev token.
      # An invalid or rejected token can otherwise make public packages appear unavailable.
      - uses: flutter-actions/setup-flutter@v4
        with:
          channel: stable
          version: 3.47.0
      - name: Install dependencies
        run: flutter pub get

      # Provision OIDC authentication only for the publication steps.
      - uses: dart-lang/setup-dart@v1
      - uses: flutter-actions/setup-flutter@v4
        with:
          channel: stable
          version: 3.47.0
      # Dependency resolution may regenerate the checked-in desktop registrants in the
      # example app. Restore only those generated files so pub's clean-git publish check
      # sees the exact versioned package tree.
      - name: Restore generated example registrants
        run: |
          git restore -- \
            example/linux/flutter/generated_plugin_registrant.cc \
            example/linux/flutter/generated_plugin_registrant.h \
            example/linux/flutter/generated_plugins.cmake \
            example/windows/flutter/generated_plugin_registrant.cc \
            example/windows/flutter/generated_plugin_registrant.h \
            example/windows/flutter/generated_plugins.cmake
          git diff --exit-code -- \
            example/linux/flutter/generated_plugin_registrant.cc \
            example/linux/flutter/generated_plugin_registrant.h \
            example/linux/flutter/generated_plugins.cmake \
            example/windows/flutter/generated_plugin_registrant.cc \
            example/windows/flutter/generated_plugin_registrant.h \
            example/windows/flutter/generated_plugins.cmake
      - name: Publish - dry run
        run: flutter pub publish --dry-run
      - name: Publish to pub.dev
        run: flutter pub publish --force
