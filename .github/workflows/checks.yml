name: checks

on:
  push:
    branches: ["**"]
  pull_request:

jobs:
  wiki:
    name: Wiki and agent configuration
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      # Enforces AGENTS.md and wiki/conventions/ in CI as well as in-session.
      # A rule only checked by a hook holds until someone edits the file outside
      # an agent session; this is the backstop for that.
      - name: Lint wiki and agent configuration
        run: python3 tools/lint_wiki.py

  package:
    name: Flutter package
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: 3.47.0

      - name: Print resolved Flutter version
        run: flutter --version

      - name: Run package check suite
        run: bash tools/check.sh
