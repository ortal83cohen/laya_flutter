name: laya_flutter
description: >-
  Offline multilingual Laya inference for Flutter. Open an ONNX agent from cache
  or a local bundle, then run typed predict for choice, score, and noul questions.
version: 0.1.0
repository: https://github.com/ortal83cohen/laya_flutter
homepage: https://github.com/ortal83cohen/laya_flutter
issue_tracker: https://github.com/ortal83cohen/laya_flutter/issues
documentation: https://github.com/ortal83cohen/laya_flutter#readme

topics:
  - onnx
  - offline
  - inference
  - flutter
  - ai

screenshots:
  - description: >-
      Classic Snake on iOS driven by offline Laya predict at each decision step.
    path: screenshots/example.gif

environment:
  sdk: ^3.13.0
  flutter: ">=3.47.0"

dependencies:
  flutter:
    sdk: flutter
  flutter_onnxruntime: ^1.8.5
  hf_tokenizers: ^1.2.2

dev_dependencies:
  dart_sentencepiece_tokenizer: ^1.4.1
  flutter_lints: ^6.0.0
  flutter_test:
    sdk: flutter
  integration_test:
    sdk: flutter
